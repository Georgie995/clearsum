# Runs the tests on GitHub's own Windows machine after every push, and every Monday even if
# nothing was pushed (so a change in delivery-desk, manifest-doctor or a new Python is noticed).
# Windows only: ClearSum is a Windows app, so claiming Linux would be dishonest.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: windows-latest
    steps:
      # The app runs delivery-desk's engine and manifest-doctor's comparer, so both are fetched
      # next to it. "delivery-verify" is manifest-doctor's folder name on the author's PC.
      - uses: actions/checkout@v4
        with:
          path: clearsum
      - uses: actions/checkout@v4
        with:
          repository: Georgie995/delivery-desk
          path: delivery-desk
      - uses: actions/checkout@v4
        with:
          repository: Georgie995/manifest-doctor
          path: delivery-verify
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The exact versions from pyproject.toml, plus pytest.
      - run: python -m pip install "pywebview==6.2.1" "keyring==25.7.0" pytest
      - run: python -m pytest -q -rs
        working-directory: clearsum
